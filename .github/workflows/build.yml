name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -DskipTests package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-nextcloud-build
          path: |
            application-nextcloud-api/target/*.jar
            application-nextcloud-api/target/*.xed
            application-nextcloud-ui/target/*.xar
            application-nextcloud-ui/target/*.xed
          if-no-files-found: error
